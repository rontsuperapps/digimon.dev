<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Login - DIGIMON</title>

  <!-- PWA — manifest & meta (samakan dengan index.html) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="theme-color" content="#07192F">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Infranexia">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 (hasil build: npm run build:css) -->
  <link rel="stylesheet" href="assets/app.css">

  <!-- Leaflet (peta district interaktif di panel kiri) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- ============================================================
       STYLE KHUSUS HALAMAN LOGIN (peta + overlay brand)
       Ditaruh terpisah dari assets/app.css (hasil build Tailwind)
       supaya tidak ikut tertimpa saat kamu jalankan build ulang.
       ============================================================ -->
  <style>
    #loginMap { position: absolute; inset: 0; z-index: 0; background: #0b1c33; }
    #loginMap .leaflet-control-attribution { font-size: 9px; background: #ffffffb3; }

    /* Dark mode: invert tile OSM biar senada sama tema gelap */
    body[data-theme="dark"] #loginMap .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.8);
    }

    /* Marker district: titik solid + cincin pulse */
    .district-marker { position: relative; width: 14px; height: 14px; }
    .district-marker-dot {
      position: absolute; inset: 0; margin: auto;
      width: 10px; height: 10px; border-radius: 9999px;
      background: var(--color-brand-400, #6a8dfb);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .district-marker-pulse {
      position: absolute; inset: 0; margin: auto;
      width: 10px; height: 10px; border-radius: 9999px;
      background: var(--color-brand-400, #6a8dfb);
      opacity: .6;
      animation: district-pulse 2.2s ease-out infinite;
    }
    @keyframes district-pulse {
      0%   { transform: scale(1);   opacity: .55; }
      100% { transform: scale(3.2); opacity: 0;   }
    }
    .district-tooltip {
      background: #0b1c33; color: #fff; border: none;
      font-family: "Outfit", sans-serif; font-size: 11.5px; font-weight: 500;
      padding: 3px 9px; border-radius: 6px;
    }
    .district-tooltip::before { display: none; }

    /* Kartu overlay brand di atas peta — dibuat TERANG (bukan gelap)
       supaya logo asli (teks hitam) tetap terbaca jelas. */
    .map-overlay {
      position: absolute;
      z-index: 10;
      max-width: 260px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(15, 23, 42, .07);
      box-shadow: 0 10px 30px rgba(7, 25, 47, .18);
      pointer-events: none;
      font-family: "Outfit", sans-serif;
    }
    .map-overlay--top { top: 24px; left: 24px; }
    .map-overlay--bottom {
      bottom: 24px; left: 24px;
      display: flex; flex-wrap: wrap;
      gap: 5px 14px;
      max-width: calc(100% - 48px);
      padding: 10px 14px;
    }
    .map-overlay-subtitle {
      font-size: 10px; font-weight: 500; text-transform: uppercase;
      letter-spacing: .16em; color: #667085; margin-top: 8px;
    }
    .map-overlay-desc { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: #475467; }
    .map-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #344054; }
    .map-legend-dot { width: 6px; height: 6px; border-radius: 50%; background: #2c3979; flex-shrink: 0; }

    /* Dark mode untuk badge overlay peta (top & bottom) — sebelumnya
       selalu terang walau tema sudah gelap. Logo infraNexia (teks
       hitam) dibungkus chip putih terpisah supaya tetap kebaca tanpa
       perlu file logo versi terang/gelap. */
    body[data-theme="dark"] .map-overlay {
      background: rgba(13, 27, 49, 0.88);
      border-color: rgba(255, 255, 255, .08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
    body[data-theme="dark"] .map-overlay-subtitle { color: #8b9dc3; }
    body[data-theme="dark"] .map-overlay-desc { color: #cbd5e1; }
    body[data-theme="dark"] .map-legend-item { color: #e2e8f0; }
    body[data-theme="dark"] .map-legend-dot { background: var(--color-brand-400, #6a8dfb); }

    .map-overlay-logo-chip {
      display: inline-block;
      background: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      line-height: 0;
    }

    /* ============================================================
       MOTIF DIAGONAL (merah/biru/abu-abu) — terinspirasi garis
       diagonal pada logo Infranexia. Ditulis manual (bukan class
       Tailwind arbitrary) karena kombinasi warna ini tidak ada di
       app.css.
       ============================================================ */
    .form-decor-chevrons {
      position: absolute;
      right: -70px;
      bottom: -50px;
      width: 260px;
      height: 260px;
      z-index: 0;
      pointer-events: none;
    }
    .form-decor-chevrons span {
      position: absolute;
      top: 0;
      width: 46px;
      height: 240px;
      border-radius: 8px;
      transform: rotate(-24deg);
    }
    .form-decor-chevrons span:nth-child(1) { left: 30px;  background: #df1d26; opacity: .09; }
    .form-decor-chevrons span:nth-child(2) { left: 90px;  background: #2c3979; opacity: .09; }
    .form-decor-chevrons span:nth-child(3) { left: 150px; background: #bdbec0; opacity: .09; }
    body[data-theme="dark"] .form-decor-chevrons span { opacity: .16; }

    /* ============================================================
       LAYOUT LOGIN — PETA FULL-BLEED (desktop) + FORM MENGAMBANG
       DI KANAN
       Sebelumnya split 2 kolom sama besar (grid lg:grid-cols-2).
       Sekarang peta mengisi SELURUH layar (>=1024px), dan form
       login jadi kartu yang mengambang di sisi kanan di atasnya.
       Ditulis manual (bukan class Tailwind) karena butuh warna &
       shadow spesifik yang tidak ada di assets/app.css.
       Di mobile (<1024px) perilaku TIDAK berubah: peta tetap
       disembunyikan, form tetap di tengah layar seperti sebelumnya.
       ============================================================ */
    .login-form-col {
      position: relative;
      z-index: 10;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 1024px) {
      .login-form-col { justify-content: flex-end; }
      #loginCard { margin-right: clamp(24px, 6vw, 96px); }
    }

    /* Kartu form login — PUTIH SOLID (bukan transparan), supaya
       kontras tegas dari peta di belakangnya dan logo DIGIMON di
       dalamnya selalu kebaca jelas, terkesan modern & simple. */
    #loginCard {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-2xl);
      padding: 28px 28px;
      box-shadow: var(--shadow-theme-xl);
    }
    @media (min-width: 640px) {
      #loginCard { padding: 32px 36px; }
    }
    body[data-theme="dark"] #loginCard {
      background: var(--color-gray-dark);
      border-color: var(--color-gray-800);
    }
  </style>
</head>
<body data-theme="light">

  <!-- Container scroll sendiri: <body> di app.css dikunci h-screen/overflow-hidden untuk dashboard -->
  <div class="fixed inset-0 overflow-y-auto bg-white dark:bg-gray-900">

    <!-- ══════════ PANEL PETA DISTRICT (desktop) — FULL-BLEED ══════════
         Mengisi SELURUH layar (bukan cuma setengah lagi) mulai
         breakpoint lg. Form login (di bawah) mengambang di atasnya,
         digeser ke kanan. Di mobile tetap tidak tampil, sama seperti
         sebelumnya. ══════════ -->
    <aside class="login-panel absolute inset-0 hidden overflow-hidden lg:flex" aria-hidden="true">

      <!-- Peta Leaflet mengisi seluruh panel -->
      <div id="loginMap"></div>

      <!-- Overlay brand, mengambang di atas peta -->
      <div class="map-overlay map-overlay--top">
        <span class="map-overlay-logo-chip"><img src="icons/logo-infranexia.png" alt="Infranexia" style="height:24px;width:auto;display:block"></span>
        <div class="map-overlay-subtitle">DIGIMON · Digital Monitoring</div>
        <p class="map-overlay-desc">Pantau progres Go Live secara langsung di setiap district cakupan jaringan.</p>
      </div>

      <!-- Legend district, di bagian bawah panel -->
      <div class="map-overlay map-overlay--bottom">
        <span class="map-legend-item"><span class="map-legend-dot"></span>Suramadu</span>
        <span class="map-legend-item"><span class="map-legend-dot"></span>Lamongan</span>
        <span class="map-legend-item"><span class="map-legend-dot"></span>Madiun</span>
        <span class="map-legend-item"><span class="map-legend-dot"></span>Sidoarjo</span>
        <span class="map-legend-item"><span class="map-legend-dot"></span>Malang</span>
        <span class="map-legend-item"><span class="map-legend-dot"></span>Jember</span>
      </div>
    </aside>

    <!-- ══════════ KOLOM FORM — mengambang di kanan (desktop), tengah (mobile) ══════════ -->
    <main class="login-form-col relative overflow-hidden px-5 py-10 sm:px-8">

      <!-- Motif diagonal (merah/biru/abu-abu) khas logo Infranexia -->
      <div class="form-decor-chevrons" aria-hidden="true"><span></span><span></span><span></span></div>

      <section class="relative w-full max-w-[400px]" id="loginCard">

        <!-- Brand DIGIMON, selalu tampil di atas form (desktop & mobile).
             Logo dibuat center & besar, teks di sampingnya dihapus
             karena sudah terwakili oleh logo itu sendiri.
             data-src-light/data-src-dark: hook untuk 2 versi warna logo
             (terang/gelap) kalau filenya sudah tersedia — lihat
             applyDigimonLogoForTheme() di bawah. Sampai file itu ada,
             keduanya fallback ke file yang sama. -->
        <div class="mb-6 flex justify-center">
          <img id="digimonLogo" src="icons/logo-digimon.png"
               data-src-light="icons/logo-digimon-light.png"
               data-src-dark="icons/logo-digimon.png"
               onerror="this.onerror=null;this.src=this.dataset.srcDark;"
               alt="DIGIMON" style="height:52px;width:auto;display:block">
        </div>

          <div class="mb-6 text-center">
            <h1 class="mb-1 text-title-sm font-semibold text-gray-800 dark:text-white/90">Selamat datang</h1>
            <p class="text-theme-sm text-gray-500 dark:text-gray-400">Masuk untuk mengakses dashboard operasional dan monitoring project.</p>
          </div>

          <form onsubmit="doLogin(event); return false;" novalidate class="space-y-4">
            <div>
              <label for="inputUsername" class="mb-1.5 block text-theme-sm font-medium text-gray-700 dark:text-gray-400">Username</label>
              <input id="inputUsername" class="auth-input" type="text" autocomplete="username" placeholder="Masukkan username" spellcheck="false">
            </div>

            <div>
              <label for="inputPassword" class="mb-1.5 block text-theme-sm font-medium text-gray-700 dark:text-gray-400">Password</label>
              <div class="relative">
                <input id="inputPassword" class="auth-input pr-12" type="password" autocomplete="current-password" placeholder="Masukkan password">
                <button type="button" id="togglePasswordBtn" onclick="togglePassword()" aria-label="Tampilkan password" title="Tampilkan/Sembunyikan Password"
                        class="absolute top-1/2 right-2 flex size-8 -translate-y-1/2 items-center justify-center rounded-md text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                  <svg id="eyeOpen" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg id="eyeClosed" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.1"></path><path d="M6.4 6.4A17.5 17.5 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between gap-3">
              <label class="flex cursor-pointer select-none items-center gap-2.5 text-theme-sm text-gray-700 dark:text-gray-400">
                <input type="checkbox" id="rememberMe" class="size-4.5 rounded border-gray-300 text-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:ring-offset-0 dark:border-gray-600 dark:bg-gray-900">
                <span>Ingat username</span>
              </label>
              <span class="inline-flex items-center gap-1.5 text-theme-xs text-gray-400">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
                Secure Access
              </span>
            </div>

            <button type="submit" id="btnLogin"
                    class="relative flex h-11 w-full items-center justify-center gap-2 overflow-hidden rounded-lg bg-brand-500 px-5 text-theme-sm font-medium text-white shadow-theme-xs transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-70">
              <span id="btnSpinner" class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white" style="display:none"></span>
              <span id="btnText">Masuk ke Dashboard</span>
              <svg id="btnArrow" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
            </button>
          </form>

          <div class="alert-box" id="alertBox" role="alert">
            <span id="alertIcon"></span>
            <span id="alertText"></span>
          </div>

          <p class="mt-6 text-center text-theme-xs text-gray-400"><span class="font-medium text-gray-500 dark:text-gray-400">DIGIMON</span> &nbsp;·&nbsp; © 2026</p>
        </section>
    </main>
  </div>

  <!-- Toggle tema terang/gelap (tampilan awal selalu terang, tidak disimpan) -->
  <button type="button" id="themeToggleBtn" onclick="toggleLoginTheme()" title="Ganti Tema" aria-label="Ganti tema terang/gelap"
          class="fixed right-5 bottom-5 z-50 flex size-12 items-center justify-center rounded-full bg-brand-500 text-white shadow-theme-lg transition-colors hover:bg-brand-600 dark:bg-brand-500">
    <svg id="loginThemeIconMoon" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
    <svg id="loginThemeIconSun" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  </button>

  <!-- Leaflet JS (peta district) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    /* ============================================================
       MIGRASI PWA — KONFIGURASI API GAS
       ============================================================
       Ganti GAS_EXEC_URL di bawah dengan URL deployment Web App GAS
       kamu (Deploy > Manage deployments > Web app > URL, yang
       berakhiran "/exec"). URL ini SAMA dipakai di index.html.
       ============================================================ */
    const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycby6qUomlq-4uDMvCJyj2BCUR-Oope1oaCGXZgWydnWjv5FKb7qDEP3yutQ8rbAdZWu7rw/exec';

    // Wrapper pengganti google.script.run. Body dikirim sebagai STRING
    // JSON dengan Content-Type text/plain supaya browser tidak kirim
    // CORS preflight (GAS tidak bisa merespons preflight OPTIONS).
    async function callGAS(fn, args) {
      const res = await fetch(GAS_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args || [] })
      });

      if (!res.ok) {
        throw new Error('HTTP ' + res.status + ' dari server GAS.');
      }

      return res.json();
    }

    /* ============================================================
       UI HELPERS
       ============================================================ */

    function togglePassword() {
      const input = document.getElementById('inputPassword');
      const openIcon = document.getElementById('eyeOpen');
      const closedIcon = document.getElementById('eyeClosed');
      const btn = document.getElementById('togglePasswordBtn');

      const isPassword = input.type === 'password';

      input.type = isPassword ? 'text' : 'password';
      openIcon.style.display = isPassword ? 'none' : 'block';
      closedIcon.style.display = isPassword ? 'block' : 'none';

      btn.setAttribute(
        'aria-label',
        isPassword ? 'Sembunyikan password' : 'Tampilkan password'
      );
    }


    function showAlert(type, message) {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertText');
      const icon = document.getElementById('alertIcon');

      box.className = 'alert-box ' + type + ' show';
      text.textContent = message;

      if (type === 'success') {
        icon.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12.3 2.7 2.7L16 9.3"></path>
          </svg>
        `;
      } else {
        icon.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
        `;
      }
    }


    function hideAlert() {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box';
    }


    function addRipple(btn, event) {
      if (!btn || !event) return;

      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');

      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';

      btn.appendChild(ripple);

      setTimeout(function() {
        ripple.remove();
      }, 700);
    }


    /* ============================================================
       TOGGLE TEMA TERANG/GELAP
       Tampilan awal SELALU light (tidak disimpan ke localStorage),
       sesuai permintaan. Ikon menunjukkan mode tujuan saat diklik.
       ============================================================ */
    function toggleLoginTheme() {
      const body = document.body;
      const iconSun = document.getElementById('loginThemeIconSun');
      const iconMoon = document.getElementById('loginThemeIconMoon');

      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
        applyDigimonLogoForTheme('light');
      } else {
        body.setAttribute('data-theme', 'dark');
        iconSun.style.display = 'block';
        iconMoon.style.display = 'none';
        applyDigimonLogoForTheme('dark');
      }
    }

    // Tukar file logo DIGIMON sesuai tema. Sampai file
    // icons/logo-digimon-light.png benar-benar diupload, ini akan
    // otomatis fallback ke logo-digimon.png (lihat onerror di <img>),
    // jadi aman dipanggil kapan saja tanpa merusak tampilan sekarang.
    function applyDigimonLogoForTheme(theme) {
      const img = document.getElementById('digimonLogo');
      if (!img) return;
      const src = theme === 'dark' ? img.dataset.srcDark : img.dataset.srcLight;
      if (src) img.src = src;
    }


    /* ============================================================
       PETA DISTRICT (panel kiri, desktop)
       Hanya di-init di layar >=1024px (breakpoint 'lg') supaya tidak
       memboroskan tile request di mobile, karena panel ini memang
       disembunyikan (hidden lg:block) di layar kecil.
       Catatan: tile OSM butuh koneksi internet — tidak ikut ter-cache
       oleh sw.js (yang hanya cache app-shell), jadi kalau device
       offline peta tidak akan muncul walau form login tetap jalan.
       ============================================================ */

    let loginMap = null;

    const DISTRICT_MARKERS = [
      { name: 'Suramadu', lat: -7.1667, lng: 112.7500 },
      { name: 'Lamongan', lat: -7.1219, lng: 112.4171 },
      { name: 'Madiun',   lat: -7.6298, lng: 111.5239 },
      { name: 'Sidoarjo', lat: -7.4478, lng: 112.7183 },
      { name: 'Malang',   lat: -7.9666, lng: 112.6326 },
      { name: 'Jember',   lat: -8.1844, lng: 113.6681 }
    ];

    function initLoginMap() {
      const mapEl = document.getElementById('loginMap');
      if (!mapEl || loginMap || typeof L === 'undefined') return;

      loginMap = L.map('loginMap', {
        zoomControl: false,
        attributionControl: true,
        scrollWheelZoom: false
      }).setView([-7.6, 112.9], 8);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap'
      }).addTo(loginMap);

      const bounds = [];

      DISTRICT_MARKERS.forEach(function (d) {
        const icon = L.divIcon({
          className: 'district-marker',
          html: '<span class="district-marker-pulse"></span><span class="district-marker-dot"></span>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        L.marker([d.lat, d.lng], { icon: icon })
          .addTo(loginMap)
          .bindTooltip(d.name, { direction: 'top', offset: [0, -6], className: 'district-tooltip' });

        bounds.push([d.lat, d.lng]);
      });

      loginMap.fitBounds(bounds, { padding: [48, 48] });
    }

    function handleMapVisibility() {
      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

      if (isDesktop) {
        initLoginMap();
        if (loginMap) {
          // Container baru kelihatan / berubah ukuran -> paksa Leaflet
          // menghitung ulang dimensinya, kalau tidak tile-nya bisa
          // kepotong/abu-abu.
          setTimeout(function () { loginMap.invalidateSize(); }, 200);
        }
      }
    }

    window.addEventListener('resize', handleMapVisibility);


    /* ============================================================
       LOGIN SYSTEM
       Dipertahankan kompatibel dengan Google Apps Script Anda.
       ============================================================ */

    let isSubmitting = false;

    function doLogin(e) {
      if (e) {
        e.preventDefault();
      }

      if (isSubmitting) return;

      if (e) {
        addRipple(document.getElementById('btnLogin'), e);
      }

      hideAlert();

      const username = document.getElementById('inputUsername').value.trim();
      const password = document.getElementById('inputPassword').value.trim();

      if (!username || !password) {
        showAlert('error', 'Username dan password tidak boleh kosong.');
        shakeCard();
        return;
      }

      isSubmitting = true;
      setLoading(true);

      callGAS('validateLogin', [username, password])
        .then(function(result) {
          setLoading(false);

          if (result.success) {
            showAlert('success', 'Login berhasil! Mengalihkan ke dashboard...');

            if (document.getElementById('rememberMe').checked) {
              localStorage.setItem('nimon_user', username);
            } else {
              localStorage.removeItem('nimon_user');
            }

            // Token sesi disimpan di localStorage. index.html membacanya
            // balik dari sini di setiap panggilan API.
            localStorage.setItem('monproj_session_token', result.token);

            setTimeout(function() {
              // Dulu: window.top.location.href = result.redirectUrl
              // (perlu window.top karena GAS berjalan di iframe sandbox).
              // Sekarang halaman ini bukan iframe lagi -- redirect biasa
              // ke halaman dashboard statis (ganti nama file di bawah
              // kalau dashboard-mu tidak bernama index.html).
              // AUDIT PERFORMA: delay diturunkan dari 800ms -> 300ms.
              // 300ms masih cukup untuk toast "Login berhasil" sempat
              // terlihat sekilas, tapi tidak menambah setengah detik lebih
              // ke waktu tunggu total user sebelum dashboard mulai memuat.
              window.location.href = 'index.html';
            }, 300);

          } else {
            isSubmitting = false;
            showAlert(
              'error',
              result.message || 'Username atau password salah.'
            );
            shakeCard();
          }
        })
        .catch(function(err) {
          isSubmitting = false;
          setLoading(false);

          showAlert(
            'error',
            'Gagal terhubung ke server. Coba lagi.'
          );

          shakeCard();
          console.error('Login error:', err);
        });
    }


    function setLoading(on) {
      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('btnSpinner');
      const text = document.getElementById('btnText');
      const arrow = document.getElementById('btnArrow');

      btn.disabled = on;
      spinner.style.display = on ? 'block' : 'none';
      arrow.style.display = on ? 'none' : 'block';
      text.textContent = on ? 'Memeriksa akses...' : 'Masuk ke Dashboard';
    }


    function shakeCard() {
      const card = document.getElementById('loginCard');

      card.classList.remove('card-shake');
      void card.offsetWidth;
      card.classList.add('card-shake');
    }


    /* ============================================================
       PREFILL REMEMBER USERNAME
       ============================================================ */

    // PWA — daftarkan service worker juga dari halaman login, supaya
    // app-shell (termasuk index.html) sudah ter-cache SEBELUM user
    // sempat login pertama kali (mis. dibuka dulu waktu online, baru
    // dipakai offline nanti).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Registrasi service worker gagal:', err);
      });
    }

    window.onload = function() {
      handleMapVisibility();

      // MIGRASI PWA: kalau sudah ada token sesi tersimpan (belum logout
      // & belum expired di server), tidak perlu login ulang -- langsung
      // ke dashboard. index.html sendiri yang akan mem-validasi token
      // ini ke server tiap kali fetch data (lihat callGAS di sana),
      // jadi kalau ternyata sudah kadaluarsa, index.html yang akan
      // melempar balik ke sini.
      if (localStorage.getItem('monproj_session_token')) {
        window.location.replace('index.html');
        return;
      }

      const saved = localStorage.getItem('nimon_user');

      if (saved) {
        document.getElementById('inputUsername').value = saved;
        document.getElementById('rememberMe').checked = true;
        document.getElementById('inputPassword').focus();
      } else {
        document.getElementById('inputUsername').focus();
      }
    };
  </script>

</body>
</html>
